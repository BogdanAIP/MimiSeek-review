name: Collect review evidence

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mimiseek-github-evidence-collector
  cancel-in-progress: false

jobs:
  collect:
    if: ${{ vars.MIMISEEK_COLLECTOR_ENABLED == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Verify server-enforced canonical ref boundary
        env:
          GH_API_URL: ${{ github.api_url }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          REQUIRED_RULESET: mimiseek-canonical-main
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          api = os.environ["GH_API_URL"].rstrip("/")
          repo = os.environ["GH_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          required_name = os.environ["REQUIRED_RULESET"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2026-03-10",
              "User-Agent": "MimiSeek-ref-boundary-check/1",
          }

          def get(path):
              request = urllib.request.Request(api + path, headers=headers, method="GET")
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.loads(response.read().decode("utf-8"))

          repository = get(f"/repos/{repo}")
          default_branch = repository["default_branch"]
          rulesets = get(f"/repos/{repo}/rulesets")
          matches = [
              item for item in rulesets
              if item.get("name") == required_name and item.get("enforcement") == "active"
          ]
          if len(matches) != 1:
              raise SystemExit(
                  f"required active ruleset {required_name!r} not uniquely present: matches={len(matches)}"
              )

          detail = get(f"/repos/{repo}/rulesets/{matches[0]['id']}")
          if detail.get("target") != "branch":
              raise SystemExit("canonical ruleset must target branches")

          ref_condition = (detail.get("conditions") or {}).get("ref_name") or {}
          include = set(ref_condition.get("include") or [])
          exclude = set(ref_condition.get("exclude") or [])
          default_ref = f"refs/heads/{default_branch}"
          if "~DEFAULT_BRANCH" not in include and default_ref not in include:
              raise SystemExit(f"canonical ruleset does not include {default_ref}")
          if "~DEFAULT_BRANCH" in exclude or default_ref in exclude:
              raise SystemExit(f"canonical ruleset excludes {default_ref}")

          rule_types = {rule.get("type") for rule in detail.get("rules") or []}
          required_types = {"pull_request", "deletion", "non_fast_forward"}
          missing = sorted(required_types - rule_types)
          if missing:
              raise SystemExit(f"canonical ruleset missing required rules: {missing}")

          branch = get(f"/repos/{repo}/branches/{default_branch}")
          if not branch.get("protected"):
              raise SystemExit(f"default branch {default_branch!r} is not reported protected")

          if detail.get("current_user_can_bypass") != "never":
              raise SystemExit(
                  "canonical ruleset bypass capability is not provably 'never' for this workflow caller"
              )

          if "bypass_actors" in detail and detail["bypass_actors"]:
              raise SystemExit("canonical ruleset has bypass actors")

          print(json.dumps({
              "ruleset_id": detail.get("id"),
              "ruleset_name": detail.get("name"),
              "default_branch": default_branch,
              "protected": branch.get("protected"),
              "current_user_can_bypass": detail.get("current_user_can_bypass"),
          }, sort_keys=True))
          PY

      - name: Checkout MimiSeek
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Resolve source App scope
        id: source-scope
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          config = json.loads(Path("config/consumers.json").read_text(encoding="utf-8"))
          repositories = [
              item["repository"]
              for item in config["consumers"]
              if item.get("evidence", {}).get("enabled", True)
          ]
          owners = {repository.split("/", 1)[0] for repository in repositories}
          if len(owners) != 1:
              raise SystemExit(
                  "collector v1 requires all enabled repositories to share one GitHub App installation owner"
              )
          owner = next(iter(owners))
          names = [repository.split("/", 1)[1] for repository in repositories]
          print(f"owner={owner}")
          print("repositories<<MIMISEEK_REPOSITORIES")
          print("\n".join(names))
          print("MIMISEEK_REPOSITORIES")
          PY

      - name: Create read-only source token
        id: source-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.MIMISEEK_COLLECTOR_CLIENT_ID }}
          private-key: ${{ secrets.MIMISEEK_COLLECTOR_PRIVATE_KEY }}
          owner: ${{ steps.source-scope.outputs.owner }}
          repositories: ${{ steps.source-scope.outputs.repositories }}
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read

      - name: Prepare non-authoritative evidence worktree
        shell: bash
        run: |
          set -euo pipefail
          branch="evidence/github-intake"
          worktree="${RUNNER_TEMP}/mimiseek-evidence"
          if git ls-remote --exit-code --heads origin "${branch}" >/dev/null 2>&1; then
            git fetch origin "${branch}:${branch}"
          else
            git branch "${branch}" "${GITHUB_SHA}"
          fi
          git worktree add "${worktree}" "${branch}"
          mkdir -p "${worktree}/evidence/github"
          {
            echo "MIMISEEK_EVIDENCE_WORKTREE=${worktree}"
            echo "MIMISEEK_EVIDENCE_BRANCH=${branch}"
          } >> "$GITHUB_ENV"

      - name: Collect source snapshots
        env:
          MIMISEEK_GITHUB_TOKEN: ${{ steps.source-token.outputs.token }}
        run: |
          python tools/collect_github_evidence.py --config config/consumers.json --output-root "${MIMISEEK_EVIDENCE_WORKTREE}/evidence/github" --state-file "${MIMISEEK_EVIDENCE_WORKTREE}/evidence/github/collector-state.json"

      - name: Re-verify canonical ref boundary before push
        env:
          GH_API_URL: ${{ github.api_url }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          REQUIRED_RULESET: mimiseek-canonical-main
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          api = os.environ["GH_API_URL"].rstrip("/")
          repo = os.environ["GH_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          required_name = os.environ["REQUIRED_RULESET"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2026-03-10",
              "User-Agent": "MimiSeek-ref-boundary-check/1",
          }

          def get(path):
              request = urllib.request.Request(api + path, headers=headers, method="GET")
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.loads(response.read().decode("utf-8"))

          repository = get(f"/repos/{repo}")
          default_branch = repository["default_branch"]
          rulesets = get(f"/repos/{repo}/rulesets")
          matches = [
              item for item in rulesets
              if item.get("name") == required_name and item.get("enforcement") == "active"
          ]
          if len(matches) != 1:
              raise SystemExit("required canonical ruleset is absent or inactive before push")
          detail = get(f"/repos/{repo}/rulesets/{matches[0]['id']}")
          ref_condition = (detail.get("conditions") or {}).get("ref_name") or {}
          include = set(ref_condition.get("include") or [])
          exclude = set(ref_condition.get("exclude") or [])
          default_ref = f"refs/heads/{default_branch}"
          rule_types = {rule.get("type") for rule in detail.get("rules") or []}
          required_types = {"pull_request", "deletion", "non_fast_forward"}
          branch = get(f"/repos/{repo}/branches/{default_branch}")
          if detail.get("target") != "branch":
              raise SystemExit("canonical ruleset no longer targets branches")
          if "~DEFAULT_BRANCH" not in include and default_ref not in include:
              raise SystemExit("canonical ruleset no longer includes default branch")
          if "~DEFAULT_BRANCH" in exclude or default_ref in exclude:
              raise SystemExit("canonical ruleset now excludes default branch")
          if required_types - rule_types:
              raise SystemExit("canonical ruleset lost required protections")
          if not branch.get("protected"):
              raise SystemExit("default branch is no longer protected")
          if detail.get("current_user_can_bypass") != "never":
              raise SystemExit(
                  "canonical ruleset bypass capability is not provably 'never' for this workflow caller"
              )
          if "bypass_actors" in detail and detail["bypass_actors"]:
              raise SystemExit("canonical ruleset has bypass actors")
          PY

      - name: Commit evidence intake
        shell: bash
        run: |
          set -euo pipefail
          cd "${MIMISEEK_EVIDENCE_WORKTREE}"
          git config user.name "mimiseek-evidence[bot]"
          git config user.email "mimiseek-evidence[bot]@users.noreply.github.com"
          git add evidence/github
          if git diff --cached --quiet; then
            echo "No evidence changes."
            exit 0
          fi
          git commit -m "evidence: collect GitHub review intake"
          git push origin "HEAD:${MIMISEEK_EVIDENCE_BRANCH}"
