name: Collector live no-op

on:
  pull_request:
    paths:
      - "tools/collect_github_evidence.py"
      - "tests/test_github_collector.py"
      - ".github/workflows/collect-review-evidence.yml"
      - ".github/workflows/collector-live-noop.yml"

permissions:
  contents: read

concurrency:
  group: mimiseek-github-evidence-collector
  cancel-in-progress: false

jobs:
  live-noop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact-head checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Verify effective canonical ref boundary
        env:
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          python tools/collect_github_evidence.py
          --verify-canonical-ref-boundary
          --required-ruleset mimiseek-canonical-main

      - name: Resolve source App scope
        id: source-scope
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          config = json.loads(Path("config/consumers.json").read_text(encoding="utf-8"))
          repositories = [
              item["repository"]
              for item in config["consumers"]
              if item.get("evidence", {}).get("enabled", True)
          ]
          owners = {repository.split("/", 1)[0] for repository in repositories}
          if len(owners) != 1:
              raise SystemExit(
                  "live no-op gate requires all enabled repositories to share one GitHub App installation owner"
              )
          owner = next(iter(owners))
          names = [repository.split("/", 1)[1] for repository in repositories]
          print(f"owner={owner}")
          print("repositories<<MIMISEEK_REPOSITORIES")
          print("\n".join(names))
          print("MIMISEEK_REPOSITORIES")
          PY

      - name: Create read-only source token
        id: source-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.MIMISEEK_COLLECTOR_CLIENT_ID }}
          private-key: ${{ secrets.MIMISEEK_COLLECTOR_PRIVATE_KEY }}
          owner: ${{ steps.source-scope.outputs.owner }}
          repositories: ${{ steps.source-scope.outputs.repositories }}
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read

      - name: Prepare live evidence baseline
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          worktree="${RUNNER_TEMP}/mimiseek-live-noop"
          git fetch origin refs/heads/evidence/github-intake
          before="$(git rev-parse FETCH_HEAD)"
          git worktree add --detach "${worktree}" "${before}"
          test -f "${worktree}/evidence/github/collector-state.json"
          {
            echo "MIMISEEK_LIVE_WORKTREE=${worktree}"
            echo "MIMISEEK_EVIDENCE_HEAD_BEFORE=${before}"
          } >> "$GITHUB_ENV"
          echo "evidence_head=${before}" >> "$GITHUB_OUTPUT"

      - name: First live convergence scan
        env:
          MIMISEEK_GITHUB_TOKEN: ${{ steps.source-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          python tools/collect_github_evidence.py \
            --config config/consumers.json \
            --output-root "${MIMISEEK_LIVE_WORKTREE}/evidence/github" \
            --state-file "${MIMISEEK_LIVE_WORKTREE}/evidence/github/collector-state.json" \
            | tee "${RUNNER_TEMP}/collector-first.json"
          cp -a "${MIMISEEK_LIVE_WORKTREE}/evidence/github" "${RUNNER_TEMP}/collector-first-pass"

      - name: Second live scan must be a byte no-op
        env:
          MIMISEEK_GITHUB_TOKEN: ${{ steps.source-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          sleep 2
          python tools/collect_github_evidence.py \
            --config config/consumers.json \
            --output-root "${MIMISEEK_LIVE_WORKTREE}/evidence/github" \
            --state-file "${MIMISEEK_LIVE_WORKTREE}/evidence/github/collector-state.json" \
            | tee "${RUNNER_TEMP}/collector-second.json"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads((Path(os.environ["RUNNER_TEMP"]) / "collector-second.json").read_text(encoding="utf-8"))
          if result.get("changed_files") != 0:
              raise SystemExit(f"second live scan changed files: {result!r}")
          if result.get("state_changed") is not False:
              raise SystemExit(f"second live scan changed durable state: {result!r}")
          repositories = result.get("repositories")
          if not isinstance(repositories, dict) or not repositories:
              raise SystemExit("second live scan returned no repository results")
          for repository, details in repositories.items():
              if details.get("changed_snapshots") != 0:
                  raise SystemExit(f"{repository}: second scan changed snapshots: {details!r}")
              if details.get("watermark_advanced") is not False:
                  raise SystemExit(f"{repository}: second scan advanced watermark: {details!r}")
          PY

          diff -ru "${RUNNER_TEMP}/collector-first-pass" "${MIMISEEK_LIVE_WORKTREE}/evidence/github"

      - name: Verify live baseline did not move concurrently
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin refs/heads/evidence/github-intake
          after="$(git rev-parse FETCH_HEAD)"
          test "${after}" = "${MIMISEEK_EVIDENCE_HEAD_BEFORE}"

      - name: Re-verify effective canonical ref boundary
        env:
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          python tools/collect_github_evidence.py
          --verify-canonical-ref-boundary
          --required-ruleset mimiseek-canonical-main
